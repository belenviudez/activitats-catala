<!DOCTYPE html>

    <style>
        .boton-fijo {
            margin-bottom: 10px;
            width: 280px;
            height: 180px;
            border: none;
            border-radius: 5px;
            background-color: #ffb362;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .botones {
            display: flex;
            gap: 20px;
            margin-left: 100px;
            margin-right: 100px;
            justify-content: center;
            margin-top: 250px;
            flex-wrap: wrap;
            max-width: fit-content;
        }

        .boton-fijo:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .boton-fijo .titulo {
            padding: 12px 25px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            transition: all 0.3s ease;
        }

        .boton-fijo .subtexto {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .boton-fijo:hover .titulo {
            top: 30%;
            transform: translate(-50%, -50%);
        }

        .boton-fijo:hover .subtexto {
            opacity: 1;
        }

        .botones .boton-fijo {
            background-color: #ffd190;
        }
    </style>
