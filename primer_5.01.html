    html, body {

    .tabla{
        position: absolute;

    }

    .tabla-ejercicio{
        border-collapse: collapse;
    }

    .tabla-ejercicio td{
        border: 1px solid black;
        padding: 10px;
        min-width: 120px;
        text-align: center;
    }

    .tabla-ejercicio input{
        width: 120px;
        border: none;
        border-bottom: 2px solid black;
        background-color: rgba(255, 255, 255, 0.184);
        outline: none;
        font-size: 16px;
    }

    .botones{

        top: 445px;
        left: 200px;

    .botones button {
        padding: 12px 25px;

        border: none;
        border-radius: 30px;
        background: #fba74e84;
        color: #000000;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-right: 30px;
    }

    .botones button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    #boton-reintentar{
        visibility: hidden;
    }

    .indice {
        position: fixed;
        bottom: 5%;
        left: 50%;
        display: flex;
        transform: translateX(-50%);
        gap: 12px;
    }

    .pag_diferent {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #fba74eb2;
        display: inline-block;
        transition: 0.2s;
    }

    .pag_diferent:hover {
        background-color: #fba74e;
        transform: scale(1.15);
    }

    .pag_actual {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #e98315;
        cursor: default;
    }
    </style>
</head>

    <div class="hero2">
        <div class="titol"><b>1. Completa aquesta taula amb la 1a persona del singular:</b></div>
        <div class="tabla">
            <table class="tabla-ejercicio">

                <tr>
                    <td><b>Imperfet</b></td>
                    <td><b>Infinitiu</b></td>
                    <td><b>Futur</b></td>
                    <td><b>Condicional</b></td>
                </tr>

                <tr>
                    <td>Admetia</td>
                    <td><input type="text" class="respuesta" data-correct="admetre"></td>
                    <td><input type="text" class="respuesta" data-correct="admetré"></td>
                    <td><input type="text" class="respuesta" data-correct="admetria"></td>
                </tr>

                <tr>
                    <td>Transmetia</td>
                    <td><input type="text" class="respuesta" data-correct="transmetre"></td>
                    <td><input type="text" class="respuesta" data-correct="transmetré"></td>
                    <td><input type="text" class="respuesta" data-correct="transmetria"></td>
                </tr>

                <tr>
                    <td>Percebia</td>
                    <td><input type="text" class="respuesta" data-correct="percebre"></td>
                    <td><input type="text" class="respuesta" data-correct="percebré"></td>
                    <td><input type="text" class="respuesta" data-correct="percebria"></td>
                </tr>

                <tr>
                    <td>Incloïa</td>
                    <td><input type="text" class="respuesta" data-correct="incloure"></td>
                    <td><input type="text" class="respuesta" data-correct="inclouré"></td>
                    <td><input type="text" class="respuesta" data-correct="inclouria"></td>
                </tr>

                <tr>
                    <td>Batia</td>
                    <td><input type="text" class="respuesta" data-correct="batre"></td>
                    <td><input type="text" class="respuesta" data-correct="batré"></td>
                    <td><input type="text" class="respuesta" data-correct="batria"></td>
                </tr>
            </table>
        </div>
        
        <div class="botones">
            <button id="boton-corregir">Corregir</button>
            <button id="boton-reintentar">Reintentar</button>
        </div>
    </div>
    <script>
    const inputs = document.querySelectorAll('.respuesta');
    const botonCorregir = document.getElementById('boton-corregir');
    const botonReintentar = document.getElementById('boton-reintentar');

    function comprobarRespuestas() {
        inputs.forEach(input => {
            const valor = input.value.trim().toLowerCase();
            const correcta = input.dataset.correct.toLowerCase();
            if (valor === correcta) {
                input.style.background = "rgba(0,255,0,0.25)";
                input.disabled = true;
            } else {
                input.style.background = "rgba(255,0,0,0.25)";
            }
        });
        botonReintentar.style.visibility = "visible";
    }

    function reintentar() {
        inputs.forEach(input => {
            input.value = "";
            input.style.background = "rgba(255, 255, 255, 0.184)"; // estado inicial
            input.disabled = false; // desbloqueamos todos
        });
        botonReintentar.style.visibility = "hidden"; // ocultamos reintentar
    }
    botonCorregir.addEventListener('click', comprobarRespuestas);
    botonReintentar.addEventListener('click', reintentar);
        
    </script>
