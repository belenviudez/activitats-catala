<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Fonètica</title>

    <style>
        html, body {
            overflow-x: hidden;
        }

        body {
            margin: 0;
            position: relative;
        }
        
        .tabla{
            position:absolute;
            top:280px;
            left:198px;
            display:grid;
            grid-template-columns: repeat(2, 1fr);
            gap:30px;
            width:75%;
        }

        .columna{
            background: rgba(255,255,255,0.2);
            border-radius:10px;
            padding:15px;
            min-height:270px;
        }

        .columna h3{
            text-align:center;
            margin-bottom:15px;
        }

        .dropzone{
            height:200px;
            border: 2px dashed rgba(0,0,0,0.3);
            border-radius: 10px;
            padding:10px;
            flex-direction:column;
            column-gap: 10px;
            column-count: 3;
            gap:10px;
        }

        .palabras{
            position:absolute;
            top:180px;
            left:200px;
            width:75%;
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }

        .palabra{
            padding: 8px 15px;
            background:#fba74e84;
            border-radius: 30px;
            cursor:grab;
            transition:0.2s;
            user-select:none;
            display:block;
            break-inside:avoid;
            margin-bottom: 5px;
        }

        .palabra:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
        }

        .botones {
            position: absolute;
            display: flex;
            gap: 20px;
            justify-content: flex-start;
            align-self: flex-start;
            top: 565px;
            left: 200px;
        }

        .botones button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 30px;
            background: #fba74e84;
            color: #000000;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 30px;
        }

        .botones button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .indice {
            position: fixed;
            bottom: 5%;
            left: 50%;
            display: flex;
            transform: translateX(-50%);
            gap: 12px;
        }

        .pag_diferent {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #fba74eb2;
            display: inline-block;
            transition: 0.2s;
        }

        .pag_diferent:hover {
            background-color: #fba74e;
            transform: scale(1.15);
        }

        .pag_actual {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #e98315;
            cursor: default;
        }

    </style>
</head>

    <div class="hero2">

        <div class="titol"><b>13. (2n Batx) Classifica els mots següents segons el so de la lletra <i>x</i>:</b></div>

        <div class="tabla">
            <div class="columna">
                <h3>Sona [ks]</h3>
                <div class="dropzone" data-categoria="sorda"></div>
            </div>
            <div class="columna">
                <h3>Sona [gz]</h3>
                <div class="dropzone" data-categoria="sonora"></div>
            </div>
        </div>

    <div class="palabras" id="contenedor-palabras">
        <div class="palabra" draggable="true" data-categoria="sorda">taxi</div>
        <div class="palabra" draggable="true" data-categoria="sorda">lèxic</div>
        <div class="palabra" draggable="true" data-categoria="sonora">exigir</div>
        <div class="palabra" draggable="true" data-categoria="sorda">expansiu</div>
        <div class="palabra" draggable="true" data-categoria="sonora">oxigen</div>
        <div class="palabra" draggable="true" data-categoria="sorda">flux</div>
        <div class="palabra" draggable="true" data-categoria="sonora">èxit</div>
        <div class="palabra" draggable="true" data-categoria="sonora">exemplificar</div>
        <div class="palabra" draggable="true" data-categoria="sorda">excusa</div>
        <div class="palabra" draggable="true" data-categoria="sonora">examinador</div>
        <div class="palabra" draggable="true" data-categoria="sorda">sufix</div>
        <div class="palabra" draggable="true" data-categoria="sorda">explorar</div>
        <div class="palabra" draggable="true" data-categoria="sonora">exacte</div>
        <div class="palabra" draggable="true" data-categoria="sonora">exhortació</div>
    </div>

    <div class="botones">
        <button id="boton-corregir">Corregir</button>
        <button id="boton-reintentar" style="display:none;">
            Reintentar
        </button>
    </div>

</div>

<script>

    const palabras = document.querySelectorAll('.palabra');
    const zonas = document.querySelectorAll('.dropzone');

    const botonCorregir = document.getElementById('boton-corregir');
    const botonReintentar = document.getElementById('boton-reintentar');

    let palabraArrastrada = null;

    palabras.forEach(palabra => {
        palabra.addEventListener('dragstart', () => {
            palabraArrastrada = palabra;
        });
    });

    zonas.forEach(zona => {
        zona.addEventListener('dragover', e => {
            e.preventDefault();
        });
        zona.addEventListener('drop', () => {
            if(palabraArrastrada){
                zona.appendChild(palabraArrastrada);
            }
        });
    });

    function comprobarRespuestas() {
        zonas.forEach(zona => {
            const categoriaCorrecta = zona.dataset.categoria;
            const palabrasDentro = zona.querySelectorAll('.palabra');

            palabrasDentro.forEach(palabra => {
                if (palabra.dataset.categoria === categoriaCorrecta) {
                    palabra.style.background = "rgba(0,255,0,0.25)";
                    palabra.setAttribute("draggable", "false");
                    palabra.style.cursor = "default";
                } else {
                    palabra.style.background = "rgba(255,0,0,0.25)";
                }
            });
        });

        botonReintentar.style.display = "inline-block";
    };

    function reintentar() {
        const contenedor = document.getElementById('contenedor-palabras');
        document.querySelectorAll('.palabra').forEach(palabra => {
            contenedor.appendChild(palabra);
            palabra.classList.remove('correcto', 'incorrecto');
            palabra.setAttribute("draggable", "true");
            palabra.style.cursor = "grab";
            palabra.style.background = "#fba74e84";
        });
        botonReintentar.style.display = "none";
    }
    
    botonCorregir.addEventListener('click', comprobarRespuestas);
    botonReintentar.addEventListener('click', reintentar);

</script>

</body>
