                        </select></td>
                    </tr>

            <button id="boton-reintentar">Reintentar</button>
        </div>

    <script>
    // Lista de respuestas correctas en orden
    const respuestas = [
  "molt content", "boig", "famós", "tímid", "sol a l'apartament", "(algú) culpable", "(algú) president", "(alguna cosa) calenta", "(algú) molt cansat", "(alguna cosa) estripada"
];
    
    const selects = document.querySelectorAll('.respuesta');
    const botonCorregir = document.getElementById('boton-corregir');
    const botonReintentar = document.getElementById('boton-reintentar');

    function comprobarRespuestas() {
        selects.forEach((select, index) => {
            if(select.value === respuestas[index]) {
                select.style.background = "rgba(0,255,0,0.25)";
                select.disabled = true;
            } else {
                select.style.background = "rgba(255,0,0,0.25)";
                select.disabled = false;
            }
        });
        botonReintentar.style.display = "inline-block";
    }

    function reintentar() {
        selects.forEach(select => {
            select.selectedIndex = 0;
            select.style.background = "rgba(255,255,255,0.184)";
            select.disabled = false;
        });
        botonReintentar.style.display = "none";
    }
 
    botonCorregir.addEventListener('click', comprobarRespuestas);
    botonReintentar.addEventListener('click', reintentar);
    </script>
