    <div class="hero2">
        <div class="titol"><b>2. Completa aquesta taula:</b></div>
        <div class="tabla">
            <table class="tabla-ejercicio">
                <tr>
                    <td><b>Masculí Singular</b></td>
                    <td><b>Femení Singular</b></td>
                    <td><b>Masculí Plural</b></td>
                    <td><b>Femení Plural</b></td>
                </tr>

                <tr>
                    <td>precoç</td>
                    <td><input type="text" class="respuesta" data-correct="precoç"></td>
                    <td><input type="text" class="respuesta" data-correct="precoços"></td>
                    <td><input type="text" class="respuesta" data-correct="precoces"></td>
                </tr>

                <tr>
                    <td>audaç</td>
                    <td><input type="text" class="respuesta" data-correct="audaç"></td>
                    <td><input type="text" class="respuesta" data-correct="audaços"></td>
                    <td><input type="text" class="respuesta" data-correct="audaces"></td>
                </tr>

                <tr>
                    <td>veloç</td>
                    <td><input type="text" class="respuesta" data-correct="veloç"></td>
                    <td><input type="text" class="respuesta" data-correct="veloços"></td>
                    <td><input type="text" class="respuesta" data-correct="veloces"></td>
                </tr>

                <tr>
                    <td>feliç</td>
                    <td><input type="text" class="respuesta" data-correct="feliç"></td>
                    <td><input type="text" class="respuesta" data-correct="feliços"></td>
                    <td><input type="text" class="respuesta" data-correct="felices"></td>
                </tr>

                <tr>
                    <td>atroç</td>
                    <td><input type="text" class="respuesta" data-correct="atroç"></td>
                    <td><input type="text" class="respuesta" data-correct="atroços"></td>
                    <td><input type="text" class="respuesta" data-correct="atroces"></td>
                </tr>

                <tr>
                    <td>capaç</td>
                    <td><input type="text" class="respuesta" data-correct="capaç"></td>
                    <td><input type="text" class="respuesta" data-correct="capaços"></td>
                    <td><input type="text" class="respuesta" data-correct="capaces"></td>
                </tr>
            </table>
        </div>
        <div class="botones">
            <button id="boton-corregir">Corregir</button>
            <button id="boton-reintentar">Reintentar</button>
        </div>
    </div>
    
    <script>
    const inputs = document.querySelectorAll('.respuesta');
    const botonCorregir = document.getElementById('boton-corregir');
    const botonReintentar = document.getElementById('boton-reintentar');

    function comprobarRespuestas() {
        inputs.forEach(input => {
            const valor = input.value.trim().toLowerCase();
            const correcta = input.dataset.correct.toLowerCase();

            if (valor === correcta) {
                input.style.background = "rgba(0,255,0,0.25)";
                input.disabled = true;

            } else {
                input.style.background = "rgba(255,0,0,0.25)";
            }});
            botonReintentar.style.visibility = "visible";
        }
        
        function reintentar() {
            inputs.forEach(input => {
                input.value = "";
                input.style.background = "rgba(255, 255, 255, 0.184)"; // estado inicial
                input.disabled = false; // desbloqueamos todos
            });
            botonReintentar.style.visibility = "hidden"; // ocultamos reintentar
        }
        
        botonCorregir.addEventListener('click', comprobarRespuestas);
        botonReintentar.addEventListener('click', reintentar);
    </script>
