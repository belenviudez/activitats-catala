  <style>
    html, body {
        overflow-x: hidden;
    }

    .tabla {
        position: absolute; 
        top: 180px; 
        left: 200px; 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        column-gap: 80px;
        counter-reset: letra;
    }
    .lista {
        list-style: none;
        padding-left: 0px;
    }

    .lista li {
        counter-increment: letra;
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        font-size: 16px;
    }

    .lista li::before {
        content: counter(letra, lower-alpha) ") ";
        width: 30px;
    }


    .lista li span {
        width: auto;
    }

    .lista input {
        border: none;
        border-bottom: 2px solid black;
        background-color: rgba(255, 255, 255, 0.184);
        outline: none;
        width: max-content;
        font-size: 16px;
        margin-left: 10px;
        margin-right: 10px;
    }

    .botones {
        position: absolute;
        top: 325px;
        left: 200px; 
        align-items: left;
    }

    .botones button {
        padding: 12px 25px;
        font-size: 1rem;
        border: none;
        border-radius: 30px;
        background: #fba74e84;
        color: #000000;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-right: 30px;
    }

    .botones button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .indice {
        position: fixed;
        bottom: 5%;
        left: 50%;
        display: flex;
        transform: translateX(-50%);
        gap: 12px;
    }

    .pag_diferent {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #fba74eb2;
        display: inline-block;
        transition: 0.2s;
    }

    .pag_diferent:hover {
        background-color: #fba74e;
        transform: scale(1.15);
    }

    .pag_actual {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #e98315;
        cursor: default;
    }
  </style>
</head>

    <div class="hero2">
        <div class="titol"><b>14. Escriu el participi dels verbs següents:</b></div>
        <div class="tabla">
            <ol class="lista">
                <li><span>estrènyer &rarr; </span> <input type="text" class="respuesta"></li>
                <li><span>riure &rarr; </span> <input type="text" class="respuesta"></li>
                <li><span>cobrir &rarr; </span> <input type="text" class="respuesta"></li>
                <li><span>aparèixer &rarr; </span> <input type="text" class="respuesta"></li>
            </ol>

            <ol class="lista">
                <li><span>ajeure &rarr; </span> <input type="text" class="respuesta"></li>
                <li><span>tenir &rarr; </span> <input type="text" class="respuesta"></li>
                <li><span>omplit &rarr; </span> <input type="text" class="respuesta"></li>
                <li><span>admetre &rarr; </span> <input type="text" class="respuesta"></li>        
            </ol>
        </div>
        <div class="botones">
            <button id="boton-corregir">Corregir</button>
            <button id="boton-reintentar" style="display:none;">Reintentar</button>
        </div>    
    </div>
    <script>
    // Lista de respuestas correctas en orden
    const respuestas = [
        ["estret"], 
        ["rigut"], 
        ["cobert"], 
        ["aparegut"], 
        ["ajagut"], 
        ["tingut"], 
        ["omplert"], 
        ["admès"]
    ];
    
    const inputs = document.querySelectorAll('.respuesta');
    const botonCorregir = document.getElementById('boton-corregir');
    const botonReintentar = document.getElementById('boton-reintentar');

    function comprobarRespuestas() {
        inputs.forEach((input, index) => {
            const valor = input.value.trim().toLowerCase();
            const opcionesCorrectas = respuestas[index].map(r => r.toLowerCase());
            if (opcionesCorrectas.includes(valor)) {
                input.style.background = "rgba(0, 255, 0, 0.25)";
                input.disabled = true;
            } else {
                input.style.background = "rgba(255, 0, 0, 0.25)";
                input.disabled = false;
            }
        });
        botonReintentar.style.display = "inline-block";
    }

    function reintentar() {
        inputs.forEach(input => {
            input.value = "";
            input.style.background = "rgba(255, 255, 255, 0.184)"; // estado inicial
            input.disabled = false; // desbloqueamos todos
        });
        botonReintentar.style.display = "none"; // ocultamos reintentar
    }
 
    botonCorregir.addEventListener('click', comprobarRespuestas);
    botonReintentar.addEventListener('click', reintentar);
</script>
