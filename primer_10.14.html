  <style>
    html, body {
        overflow-x: hidden;
    }

    .tabla {
        position: absolute; 
        top: 180px; 
        left: 200px; 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        column-gap: 80px;
        counter-reset: letra;
    }
    .lista {
        list-style: none;
        padding-left: 0px;
        width: 300px;
    }

    .lista li {
        counter-increment: letra;
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        font-size: 16px;
    }

    .lista li::before {
        content: counter(letra, lower-alpha) ") ";
        width: 30px;
    }


    .lista li span {
        width: max-content;
        white-space: nowrap;
    }

    .lista input {
        width: max-content;
        min-width: 0;
        border: none;
        border-bottom: 2px solid black;
        background-color: rgba(255, 255, 255, 0.184);
        outline: none;
        flex: 1;
        font-size: 16px;
        margin-left: 10px;
        margin-right: 10px;
    }

    .botones {
        position: absolute;
        top: 290px;
        left: 200px;
    }

    .botones button {
        padding: 12px 25px;
        font-size: 1rem;
        border: none;
        border-radius: 30px;
        background: #fba74e84;
        color: #000000;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        margin-right: 30px;
    }

    .botones button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    

    #boton-reintentar{
        visibility: hidden;
    }

    .indice {
        position: fixed;
        bottom: 5%;
        left: 50%;
        display: flex;
        transform: translateX(-50%);
        gap: 12px;
    }

    .pag_diferent {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #fba74eb2;
        display: inline-block;
        transition: 0.2s;
    }

    .pag_diferent:hover {
        background-color: #fba74e;
        transform: scale(1.15);
    }

    .pag_actual {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background-color: #e98315;
        cursor: default;
    }
  </style>
</head>

    <div class="hero2">
        <div class="titol"><b>14. Indica el primitiu dels mots següents:</b></div>
        <div class="tabla">
            <ol class="lista">
                <li><span>forquilla &rarr;</span> <input type="text" class="respuesta"></li>
                <li><span>càpsula &rarr;</span> <input type="text" class="respuesta"></li>
                <li><span>corbatí &rarr;</span> <input type="text" class="respuesta"></li>
            </ol>
            <ol class="lista">
                <li><span>llençol &rarr;</span> <input type="text" class="respuesta"></li>
                <li><span>pescall &rarr;</span> <input type="text" class="respuesta"></li>
                <li><span>pastilla &rarr;</span> <input type="text" class="respuesta"></li>
            </ol>
        </div>
        
        <div class="botones">
            <button id="boton-corregir">Corregir</button>
            <button id="boton-reintentar">Reintentar</button>
        </div>
    </div>
    <script>
    
    const respuestas = [
        ["forca"],["capsa"],["corbata"],["llenç"],["peix"],["pasta"]
    ];
    const inputs = document.querySelectorAll('.respuesta');
    const botonCorregir = document.getElementById('boton-corregir');
    const botonReintentar = document.getElementById('boton-reintentar');

    function comprobarRespuestas() {
        inputs.forEach((input, index) => {
            const valor = input.value.trim().toLowerCase().replace(/[.,;:]/g, "");
            const opcionesCorrectas = respuestas[index].map(r => r.toLowerCase());
            if (opcionesCorrectas.includes(valor)) {
                input.style.background = "rgba(0, 255, 0, 0.25)";
                input.disabled = true;
            } else {
                input.style.background = "rgba(255, 0, 0, 0.25)";
                input.disabled = false;
            }
        });
        botonReintentar.style.visibility = "visible";
    }

    function reintentar() {
        inputs.forEach(input => {
            input.value = "";
            input.style.background = "rgba(255, 255, 255, 0.184)"; // estado inicial
            input.disabled = false; // desbloqueamos todos
        });
        botonReintentar.style.visibility = "hidden"; // ocultamos reintentar
    }
    botonCorregir.addEventListener('click', comprobarRespuestas);
    botonReintentar.addEventListener('click', reintentar);
        
    </script>
